<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>タイ 地図</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", Meiryo, sans-serif;
      background: #f5f5f5;
      color: #222;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: #fff;
      border-bottom: 1px solid #ddd;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
      z-index: 1000;
    }
    header h1 {
      font-size: 1.15rem;
      font-weight: 600;
      color: #333;
      white-space: nowrap;
    }
    .controls {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      flex: 1;
    }
    label {
      font-size: 0.85rem;
      color: #555;
    }
    select {
      padding: 5px 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 0.9rem;
      background: #fff;
      min-width: 100px;
    }
    .count {
      font-size: 0.85rem;
      color: #666;
      margin-left: auto;
    }
    #map {
      flex: 1;
      width: 100%;
      min-height: 0;
    }
    /* Popup */
    .leaflet-popup-content {
      margin: 10px 12px;
      min-width: 200px;
      max-width: 280px;
    }
    .popup-title {
      font-weight: 600;
      font-size: 1rem;
      margin-bottom: 2px;
      line-height: 1.3;
    }
    .popup-tname {
      font-size: 0.85rem;
      color: #555;
      margin-bottom: 6px;
    }
    .popup-meta {
      font-size: 0.8rem;
      color: #777;
      margin-bottom: 8px;
    }
    .popup-des {
      font-size: 0.85rem;
      line-height: 1.45;
      margin-bottom: 8px;
      color: #333;
    }
    .popup-img {
      display: block;
      width: 100%;
      max-height: 160px;
      object-fit: cover;
      border-radius: 4px;
      margin-bottom: 6px;
      background: #eee;
    }
    .popup-link {
      font-size: 0.8rem;
      color: #1a6ebb;
      text-decoration: none;
    }
    .popup-link:hover { text-decoration: underline; }
    /* Cluster */
    .marker-cluster-small, .marker-cluster-medium, .marker-cluster-large {
      background-color: rgba(40, 120, 180, 0.55);
    }
    .marker-cluster-small div, .marker-cluster-medium div, .marker-cluster-large div {
      background-color: rgba(40, 120, 180, 0.85);
      color: #fff;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <header>
    <h1>タイ 地図</h1>
    <div class="controls">
      <label for="yearSelect">年</label>
      <select id="yearSelect">
        <option value="all">すべて</option>
      </select>
      <label for="placeSelect">場所</label>
      <select id="placeSelect">
        <option value="all">すべて</option>
      </select>
      <span class="count" id="countLabel">—</span>
    </div>
  </header>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  <script>
    const map = L.map('map', { zoomControl: true }).setView([15.5, 101], 6);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
      maxZoom: 19
    }).addTo(map);

    const cluster = L.markerClusterGroup({
      maxClusterRadius: 45,
      spiderfyOnMaxZoom: true,
      showCoverageOnHover: false
    });
    map.addLayer(cluster);

    let allData = [];
    let markersById = new Map();

    function escapeHtml(s) {
      if (!s) return '';
      return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function makePopup(d) {
      let html = `<div class="popup-title">${escapeHtml(d.name)}</div>`;
      if (d.tname) html += `<div class="popup-tname">${escapeHtml(d.tname)}</div>`;
      html += `<div class="popup-meta">${escapeHtml(d.date)} ／ ${escapeHtml(d.place)}</div>`;
      if (d.des) html += `<div class="popup-des">${escapeHtml(d.des)}</div>`;
      if (d.thumb) {
        html += `<img class="popup-img" src="${escapeHtml(d.thumb)}" alt="" loading="lazy"
                 onerror="this.style.display='none'">`;
      }
      if (d.full) {
        const label = d.ext ? '写真を見る（外部）' : '写真を見る';
        html += `<a class="popup-link" href="${escapeHtml(d.full)}" target="_blank" rel="noopener">${label}</a>`;
      }
      return html;
    }

    function updateMarkers() {
      const yearVal = document.getElementById('yearSelect').value;
      const placeVal = document.getElementById('placeSelect').value;

      cluster.clearLayers();
      let shown = 0;

      for (const d of allData) {
        if (yearVal !== 'all' && String(d.year) !== yearVal) continue;
        if (placeVal !== 'all' && d.place !== placeVal) continue;

        let marker = markersById.get(d.id);
        if (!marker) {
          marker = L.marker([d.lat, d.lon]);
          marker.bindPopup(() => makePopup(d), { maxWidth: 300 });
          markersById.set(d.id, marker);
        }
        cluster.addLayer(marker);
        shown++;
      }
      document.getElementById('countLabel').textContent = shown.toLocaleString() + ' 件';
    }

    fetch('data.json')
      .then(r => r.json())
      .then(data => {
        allData = data;

        // years
        const years = [...new Set(data.map(d => d.year))].sort((a,b) => b - a);
        const yearSelect = document.getElementById('yearSelect');
        years.forEach(y => {
          const opt = document.createElement('option');
          opt.value = y;
          opt.textContent = y;
          yearSelect.appendChild(opt);
        });

        // places (sorted by count)
        const placeCount = {};
        data.forEach(d => { placeCount[d.place] = (placeCount[d.place] || 0) + 1; });
        const places = Object.keys(placeCount).sort((a,b) => placeCount[b] - placeCount[a]);
        const placeSelect = document.getElementById('placeSelect');
        places.forEach(p => {
          const opt = document.createElement('option');
          opt.value = p;
          opt.textContent = `${p} (${placeCount[p]})`;
          placeSelect.appendChild(opt);
        });

        yearSelect.addEventListener('change', updateMarkers);
        placeSelect.addEventListener('change', updateMarkers);

        updateMarkers();
      })
      .catch(err => {
        document.getElementById('countLabel').textContent = 'データ読み込み失敗';
        console.error(err);
      });
  </script>
</body>
</html>
