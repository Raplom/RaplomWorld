<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>タイを歩き続けた記録</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
  <style>
    :root {
      --bg: #0f1419;
      --panel: #1a2332;
      --border: #2a3544;
      --text: #e7ecf3;
      --muted: #8b9bb4;
      --accent: #c9a227;
      --accent2: #e8c547;
      --temple: #c9a227;
      --ruins: #8b6914;
      --market: #e07a3d;
      --nature: #3d8b6e;
      --other: #5a6a7e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Hiragino Sans", "Noto Sans JP", "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
    }
    header {
      position: absolute; top: 0; left: 0; right: 0; z-index: 1000;
      height: 56px;
      background: linear-gradient(180deg, rgba(15,20,25,0.95) 0%, rgba(15,20,25,0.7) 100%);
      display: flex; align-items: center; padding: 0 16px; gap: 16px;
      border-bottom: 1px solid var(--border);
    }
    .logo {
      font-weight: 700; font-size: 1.1rem; color: var(--accent2);
      white-space: nowrap;
    }
    .logo span { color: var(--muted); font-weight: 400; font-size: 0.85rem; margin-left: 8px; }
    .search-box {
      flex: 1; max-width: 320px;
      position: relative;
    }
    .search-box input {
      width: 100%; padding: 8px 12px 8px 36px;
      background: var(--panel); border: 1px solid var(--border);
      border-radius: 8px; color: var(--text); font-size: 0.9rem;
    }
    .search-box input:focus { outline: none; border-color: var(--accent); }
    .search-box::before {
      content: "🔍"; position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
      font-size: 0.85rem; opacity: 0.6;
    }
    .stats-bar {
      font-size: 0.8rem; color: var(--muted); white-space: nowrap;
    }
    .stats-bar strong { color: var(--accent2); }
    #map { position: absolute; top: 56px; left: 0; right: 0; bottom: 0; }
    .panel {
      position: absolute; top: 72px; left: 12px; z-index: 900;
      width: 320px; max-height: calc(100vh - 100px);
      background: var(--panel); border: 1px solid var(--border);
      border-radius: 12px; display: flex; flex-direction: column;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
      transition: transform 0.25s ease;
    }
    .panel.collapsed { transform: translateX(calc(-100% - 20px)); }
    .panel-header {
      padding: 12px 14px; border-bottom: 1px solid var(--border);
      display: flex; justify-content: space-between; align-items: center;
      font-weight: 600; font-size: 0.95rem;
    }
    .panel-tabs {
      display: flex; border-bottom: 1px solid var(--border);
    }
    .panel-tabs button {
      flex: 1; padding: 10px; background: none; border: none;
      color: var(--muted); font-size: 0.85rem; cursor: pointer;
      border-bottom: 2px solid transparent;
    }
    .panel-tabs button.active {
      color: var(--accent2); border-bottom-color: var(--accent);
    }
    .panel-body {
      flex: 1; overflow-y: auto; padding: 8px;
    }
    .filter-group { margin-bottom: 12px; }
    .filter-group label {
      display: block; font-size: 0.75rem; color: var(--muted);
      margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.05em;
    }
    .filter-group select, .filter-group input[type="range"] {
      width: 100%; padding: 6px 8px;
      background: var(--bg); border: 1px solid var(--border);
      border-radius: 6px; color: var(--text); font-size: 0.85rem;
    }
    .cat-chips {
      display: flex; flex-wrap: wrap; gap: 4px;
    }
    .cat-chip {
      padding: 4px 8px; border-radius: 12px; font-size: 0.75rem;
      background: var(--bg); border: 1px solid var(--border);
      cursor: pointer; color: var(--muted);
    }
    .cat-chip.active { background: var(--accent); color: #111; border-color: var(--accent); }
    .trip-card, .loc-card {
      padding: 10px 12px; margin-bottom: 6px;
      background: var(--bg); border-radius: 8px;
      border: 1px solid transparent; cursor: pointer;
      transition: border-color 0.15s;
    }
    .trip-card:hover, .loc-card:hover { border-color: var(--accent); }
    .trip-card.active { border-color: var(--accent); background: #243044; }
    .trip-name { font-weight: 600; font-size: 0.9rem; margin-bottom: 2px; }
    .trip-meta { font-size: 0.75rem; color: var(--muted); }
    .loc-name { font-weight: 600; font-size: 0.85rem; }
    .loc-meta { font-size: 0.75rem; color: var(--muted); }
    .toggle-panel {
      position: absolute; top: 72px; left: 12px; z-index: 901;
      width: 36px; height: 36px; border-radius: 8px;
      background: var(--panel); border: 1px solid var(--border);
      color: var(--text); cursor: pointer; font-size: 1.1rem;
      display: none; align-items: center; justify-content: center;
    }
    .panel.collapsed + .toggle-panel, .toggle-panel.show { display: flex; }
    .leaflet-popup-content-wrapper {
      background: var(--panel); color: var(--text);
      border-radius: 10px; border: 1px solid var(--border);
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }
    .leaflet-popup-tip { background: var(--panel); }
    .leaflet-popup-content { margin: 12px; min-width: 220px; }
    .popup-img {
      width: 100%; max-height: 160px; object-fit: cover;
      border-radius: 6px; margin-bottom: 8px; background: #111;
    }
    .popup-title { font-weight: 700; font-size: 1rem; margin-bottom: 2px; }
    .popup-tname { font-size: 0.8rem; color: var(--muted); margin-bottom: 6px; }
    .popup-desc { font-size: 0.85rem; line-height: 1.45; margin-bottom: 8px; max-height: 80px; overflow-y: auto; }
    .popup-meta { font-size: 0.75rem; color: var(--muted); }
    .popup-links a {
      color: var(--accent2); font-size: 0.8rem; margin-right: 10px;
    }
    .marker-cluster-small, .marker-cluster-medium, .marker-cluster-large {
      background-color: rgba(201, 162, 39, 0.35);
    }
    .marker-cluster-small div, .marker-cluster-medium div, .marker-cluster-large div {
      background-color: rgba(201, 162, 39, 0.75); color: #111; font-weight: 700;
    }
    .year-label { font-size: 0.8rem; color: var(--muted); text-align: center; margin-top: 4px; }
    @media (max-width: 700px) {
      .panel { width: calc(100% - 24px); max-height: 45vh; }
      .stats-bar { display: none; }
      .logo span { display: none; }
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">タイを歩き続けた記録 <span id="statsText"></span></div>
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="寺名・地名・説明で検索..." />
    </div>
    <div class="stats-bar" id="filterStats"></div>
  </header>

  <div class="panel" id="sidePanel">
    <div class="panel-header">
      <span>探す</span>
      <button onclick="togglePanel()" style="background:none;border:none;color:var(--muted);cursor:pointer;font-size:1.1rem">✕</button>
    </div>
    <div class="panel-tabs">
      <button class="active" data-tab="filter">フィルター</button>
      <button data-tab="trips">旅の一覧</button>
      <button data-tab="list">地点リスト</button>
    </div>
    <div class="panel-body" id="tabFilter">
      <div class="filter-group">
        <label>県</label>
        <select id="prefSelect"><option value="">すべて</option></select>
      </div>
      <div class="filter-group">
        <label>カテゴリ</label>
        <div class="cat-chips" id="catChips"></div>
      </div>
      <div class="filter-group">
        <label>年代 <span id="yearLabel">すべて</span></label>
        <input type="range" id="yearSlider" min="1969" max="2025" value="1969" />
        <div class="year-label" id="yearRangeText">1969 — 2025</div>
      </div>
      <div class="filter-group">
        <label><input type="checkbox" id="hasDescOnly" /> 説明文がある地点のみ</label>
      </div>
      <div class="filter-group">
        <label><input type="checkbox" id="hasBlogOnly" /> ブログがある地点のみ</label>
      </div>
      <button onclick="resetFilters()" style="width:100%;padding:8px;margin-top:8px;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--muted);cursor:pointer;font-size:0.85rem">リセット</button>
    </div>
    <div class="panel-body" id="tabTrips" style="display:none"></div>
    <div class="panel-body" id="tabList" style="display:none"></div>
  </div>
  <button class="toggle-panel" id="toggleBtn" onclick="togglePanel()">☰</button>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  <script>
    let DATA = null;
    let map, markers, cluster;
    let activeTripId = null;
    let activeCats = new Set();
    let yearFilter = null; // null = all, or year number

    const CAT_COLORS = {
      temple: '#c9a227', ruins: '#8b6914', monument: '#a67c2a',
      market: '#e07a3d', museum: '#6b8cae', park: '#3d8b6e',
      nature: '#2e7d5b', station: '#5a6a7e', bus_terminal: '#5a6a7e',
      airport: '#5a6a7e', pier: '#4a7c9b', clock_tower: '#9b7c4a',
      city_pillar: '#c9a227', shrine: '#b88a2a', festival: '#c45c26',
      border: '#7a5a5a', facility: '#5a6a7e', fountain: '#4a8a9b',
      post_office: '#5a6a7e', street_art: '#8a5a9b', other: '#5a6a7e'
    };

    async function init() {
      const res = await fetch('data.json');
      DATA = await res.json();
      document.getElementById('statsText').textContent =
        `${DATA.stats.locations.toLocaleString()}地点 / ${DATA.stats.trips}旅 / ${DATA.stats.date_min.slice(0,4)}–${DATA.stats.date_max.slice(0,4)}`;

      // Pref select
      const prefSel = document.getElementById('prefSelect');
      DATA.prefs.forEach(p => {
        const o = document.createElement('option');
        o.value = p; o.textContent = p;
        prefSel.appendChild(o);
      });

      // Category chips
      const chips = document.getElementById('catChips');
      Object.entries(DATA.categories).forEach(([key, label]) => {
        const c = document.createElement('span');
        c.className = 'cat-chip';
        c.dataset.cat = key;
        c.textContent = label;
        c.onclick = () => {
          c.classList.toggle('active');
          if (c.classList.contains('active')) activeCats.add(key);
          else activeCats.delete(key);
          applyFilters();
        };
        chips.appendChild(c);
      });

      // Year slider
      const slider = document.getElementById('yearSlider');
      slider.oninput = () => {
        yearFilter = parseInt(slider.value);
        document.getElementById('yearLabel').textContent = yearFilter;
        document.getElementById('yearRangeText').textContent = `${yearFilter}年`;
        applyFilters();
      };

      // Tabs
      document.querySelectorAll('.panel-tabs button').forEach(btn => {
        btn.onclick = () => {
          document.querySelectorAll('.panel-tabs button').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          document.getElementById('tabFilter').style.display = btn.dataset.tab === 'filter' ? '' : 'none';
          document.getElementById('tabTrips').style.display = btn.dataset.tab === 'trips' ? '' : 'none';
          document.getElementById('tabList').style.display = btn.dataset.tab === 'list' ? '' : 'none';
          if (btn.dataset.tab === 'trips') renderTrips();
          if (btn.dataset.tab === 'list') renderLocList();
        };
      });

      // Search
      let searchTimer;
      document.getElementById('searchInput').oninput = (e) => {
        clearTimeout(searchTimer);
        searchTimer = setTimeout(applyFilters, 200);
      };

      document.getElementById('prefSelect').onchange = applyFilters;
      document.getElementById('hasDescOnly').onchange = applyFilters;
      document.getElementById('hasBlogOnly').onchange = applyFilters;

      // Map
      map = L.map('map', { zoomControl: false }).setView([13.75, 100.5], 6);
      L.control.zoom({ position: 'bottomright' }).addTo(map);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
        maxZoom: 19
      }).addTo(map);

      cluster = L.markerClusterGroup({
        maxClusterRadius: 50,
        spiderfyOnMaxZoom: true,
        showCoverageOnHover: false
      });
      map.addLayer(cluster);

      applyFilters();
    }

    function makeIcon(cat) {
      const color = CAT_COLORS[cat] || CAT_COLORS.other;
      return L.divIcon({
        className: '',
        html: `<div style="width:12px;height:12px;border-radius:50%;background:${color};border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,0.5)"></div>`,
        iconSize: [12, 12],
        iconAnchor: [6, 6]
      });
    }

    function applyFilters() {
      if (!DATA) return;
      const pref = document.getElementById('prefSelect').value;
      const q = document.getElementById('searchInput').value.trim().toLowerCase();
      const hasDesc = document.getElementById('hasDescOnly').checked;
      const hasBlog = document.getElementById('hasBlogOnly').checked;

      let filtered = DATA.locations.filter(loc => {
        if (pref && loc.pref !== pref) return false;
        if (activeCats.size && !activeCats.has(loc.category)) return false;
        if (yearFilter && (!loc.date || parseInt(loc.date.slice(0,4)) !== yearFilter)) return false;
        if (hasDesc && !loc.desc) return false;
        if (hasBlog && !loc.blog) return false;
        if (activeTripId) {
          const trip = DATA.trips.find(t => t.id === activeTripId);
          if (trip && loc.date) {
            if (loc.date < trip.start || loc.date > trip.end) return false;
          }
        }
        if (q) {
          const hay = `${loc.name} ${loc.tname} ${loc.desc} ${loc.pref}`.toLowerCase();
          if (!hay.includes(q)) return false;
        }
        return true;
      });

      cluster.clearLayers();
      const bounds = [];
      filtered.forEach(loc => {
        const m = L.marker([loc.lat, loc.lng], { icon: makeIcon(loc.category) });
        m.bindPopup(() => createPopup(loc), { maxWidth: 280 });
        cluster.addLayer(m);
        bounds.push([loc.lat, loc.lng]);
      });

      document.getElementById('filterStats').textContent =
        `${filtered.length.toLocaleString()} / ${DATA.stats.locations.toLocaleString()} 地点`;

      if (filtered.length && filtered.length < 500 && bounds.length) {
        // don't auto-fit when too many to avoid jumping
      }
    }

    function createPopup(loc) {
      const div = document.createElement('div');
      let imgHtml = '';
      if (loc.image) {
        imgHtml = `<img class="popup-img" src="${loc.image}" alt="" loading="lazy" onerror="this.style.display='none'" />`;
      }
      const catLabel = DATA.categories[loc.category] || loc.category;
      div.innerHTML = `
        ${imgHtml}
        <div class="popup-title">${esc(loc.name)}</div>
        ${loc.tname ? `<div class="popup-tname">${esc(loc.tname)}</div>` : ''}
        ${loc.desc ? `<div class="popup-desc">${esc(loc.desc)}</div>` : ''}
        <div class="popup-meta">${esc(loc.pref)} · ${loc.date || ''} · ${catLabel}</div>
        <div class="popup-links" style="margin-top:8px">
          ${loc.blog ? `<a href="${loc.blog}" target="_blank" rel="noopener">ブログ</a>` : ''}
          ${loc.gurl && loc.gurl !== loc.image ? `<a href="${loc.gurl}" target="_blank" rel="noopener">写真</a>` : ''}
        </div>
      `;
      return div;
    }

    function esc(s) {
      if (!s) return '';
      const d = document.createElement('div');
      d.textContent = s;
      return d.innerHTML;
    }

    function renderTrips() {
      const el = document.getElementById('tabTrips');
      el.innerHTML = DATA.trips.map(t => `
        <div class="trip-card ${activeTripId === t.id ? 'active' : ''}" data-id="${t.id}">
          <div class="trip-name">${esc(t.name)}</div>
          <div class="trip-meta">${t.period_label} · ${t.transport}${t.distance_km ? ' · ' + t.distance_km + 'km' : ''} · ${t.points_days}地点</div>
        </div>
      `).join('');
      el.querySelectorAll('.trip-card').forEach(card => {
        card.onclick = () => {
          const id = parseInt(card.dataset.id);
          if (activeTripId === id) {
            activeTripId = null;
          } else {
            activeTripId = id;
            const trip = DATA.trips.find(t => t.id === id);
            if (trip) {
              // fit to trip points roughly
              yearFilter = null;
              document.getElementById('yearSlider').value = 1969;
              document.getElementById('yearLabel').textContent = 'すべて';
            }
          }
          renderTrips();
          applyFilters();
        };
      });
    }

    function renderLocList() {
      const el = document.getElementById('tabList');
      const pref = document.getElementById('prefSelect').value;
      const q = document.getElementById('searchInput').value.trim().toLowerCase();
      let list = DATA.locations;
      if (pref) list = list.filter(l => l.pref === pref);
      if (q) list = list.filter(l => `${l.name} ${l.tname} ${l.desc}`.toLowerCase().includes(q));
      list = list.slice(0, 200); // limit
      el.innerHTML = list.map(loc => `
        <div class="loc-card" data-lat="${loc.lat}" data-lng="${loc.lng}">
          <div class="loc-name">${esc(loc.name)}</div>
          <div class="loc-meta">${esc(loc.pref)} · ${loc.date || ''}</div>
        </div>
      `).join('') || '<div style="padding:12px;color:var(--muted)">該当なし</div>';
      el.querySelectorAll('.loc-card').forEach(card => {
        card.onclick = () => {
          map.setView([parseFloat(card.dataset.lat), parseFloat(card.dataset.lng)], 15);
        };
      });
    }

    function resetFilters() {
      document.getElementById('prefSelect').value = '';
      document.getElementById('searchInput').value = '';
      document.getElementById('hasDescOnly').checked = false;
      document.getElementById('hasBlogOnly').checked = false;
      yearFilter = null;
      document.getElementById('yearSlider').value = 1969;
      document.getElementById('yearLabel').textContent = 'すべて';
      document.getElementById('yearRangeText').textContent = '1969 — 2025';
      activeCats.clear();
      activeTripId = null;
      document.querySelectorAll('.cat-chip').forEach(c => c.classList.remove('active'));
      applyFilters();
      renderTrips();
    }

    function togglePanel() {
      document.getElementById('sidePanel').classList.toggle('collapsed');
      document.getElementById('toggleBtn').classList.toggle('show');
    }

    init();
  </script>
</body>
</html>
