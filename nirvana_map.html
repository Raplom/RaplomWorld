  <script>
    const map = L.map("map").setView([13.75, 100.5], 6);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      attribution: "&copy; OpenStreetMap",
      maxZoom: 19
    }).addTo(map);

    const bounds = L.latLngBounds([5.5, 97.3], [20.5, 105.7]);
    map.setMaxBounds(bounds.pad(0.2));

    const markers = L.markerClusterGroup({
      maxClusterRadius: 45,
      spiderfyOnMaxZoom: true,
      showCoverageOnHover: false
    });

    function escapeHtml(text) {
      if (!text) return "";
      return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function buildPopup(p) {
      let html = '<div class="popup-content"><div class="popup-center">';
      html += '<div class="name">' + escapeHtml(p.name) + '</div>';
      if (p.tname) html += '<div class="tname">' + escapeHtml(p.tname) + '</div>';
      html += '<div class="place">' + escapeHtml(p.place) + '</div>';

      if (p.link) {
        html += '<a href="' + escapeHtml(p.link) + '" target="_blank" rel="noopener" class="popup-image-placeholder">';
        html += '📷 写真を見る<br><span style="font-size:11px;">' + escapeHtml(p.image || "") + '</span></a>';
      } else if (p.image) {
        html += '<div class="popup-image-placeholder" style="cursor:default;">' + escapeHtml(p.image) + '</div>';
      }

      if (p.date) html += '<div class="date">' + escapeHtml(p.date) + '</div>';
      html += '</div>';

      if (p.des) html += '<div class="popup-des">' + escapeHtml(p.des) + '</div>';

      const mapsUrl = "https://www.google.com/maps?q=" + p.lat + "," + p.lng;
      html += '<div class="popup-gps"><a href="' + mapsUrl + '" target="_blank" rel="noopener">📍 ' + escapeHtml(p.gps) + ' → Google Maps</a></div>';
      html += '</div>';
      return html;
    }

    points.forEach(function(p) {
      const marker = L.marker([p.lat, p.lng]);
      marker.bindPopup(buildPopup(p), { maxWidth: 300, minWidth: 200 });
      markers.addLayer(marker);
    });

    map.addLayer(markers);
    document.getElementById("count").textContent = points.length.toLocaleString() + " 地点（涅槃仏）";
    if (points.length > 0) map.fitBounds(markers.getBounds().pad(0.05));
  </script>
