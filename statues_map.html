  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif; }
    #map { height: 100%; width: 100%; }
    .control-panel {
      position: absolute; top: 10px; left: 10px; z-index: 1000;
      background: white; border-radius: 10px; box-shadow: 0 2px 12px rgba(0,0,0,0.25);
      width: 320px; max-height: calc(100vh - 20px); overflow: hidden;
      display: flex; flex-direction: column;
    }
    .panel-header {
      padding: 12px 14px 8px; border-bottom: 1px solid #eee;
      background: #f8f5f0;
    }
    .panel-header h3 { font-size: 15px; margin-bottom: 4px; }
    .panel-header .count { font-size: 12px; color: #666; }
    .panel-body { padding: 10px 14px; overflow-y: auto; flex: 1; }
    .section { margin-bottom: 14px; }
    .section-title {
      font-size: 12px; font-weight: bold; color: #555; margin-bottom: 6px;
      display: flex; justify-content: space-between; align-items: center;
    }
    .section-title button {
      font-size: 11px; padding: 2px 6px; border: 1px solid #ccc; border-radius: 4px;
      background: #f0f0f0; cursor: pointer;
    }
    .section-title button:hover { background: #e0e0e0; }
    .tag-list, .place-list {
      display: flex; flex-wrap: wrap; gap: 4px; max-height: 180px; overflow-y: auto;
    }
    .tag-item, .place-item {
      font-size: 11px; padding: 3px 8px; border-radius: 12px;
      background: #f0f0f0; border: 1px solid #ddd; cursor: pointer;
      user-select: none; white-space: nowrap;
    }
    .tag-item:hover, .place-item:hover { background: #e8e0d0; }
    .tag-item.selected { background: #c45c26; color: white; border-color: #a04820; }
    .place-item.selected { background: #2a6a8a; color: white; border-color: #1a4a6a; }
    .filter-info { font-size: 11px; color: #888; margin-top: 8px; }
    .popup-content { max-width: 280px; font-size: 13px; line-height: 1.4; }
    .popup-center { text-align: center; margin-bottom: 8px; }
    .popup-center .name { font-weight: bold; font-size: 15px; }
    .popup-center .tname { font-size: 12px; color: #555; margin-top: 2px; }
    .popup-center .place { font-size: 12px; color: #666; margin-top: 4px; }
    .popup-center .date { font-size: 12px; color: #333; margin-top: 6px; }
    .popup-tags { margin: 6px 0; text-align: center; }
    .popup-tag {
      display: inline-block; font-size: 10px; padding: 2px 6px; margin: 1px;
      background: #eee; border-radius: 8px; color: #444;
    }
    .popup-image-placeholder {
      width: 240px; height: 120px; margin: 8px auto;
      background: linear-gradient(135deg, #f0e6d8 0%, #e8d5c0 100%);
      border-radius: 4px; display: flex; align-items: center; justify-content: center;
      color: #6b4c2a; font-size: 13px; text-decoration: none; border: 1px solid #d4b896;
      flex-direction: column;
    }
    .popup-image-placeholder:hover { background: linear-gradient(135deg, #e8d5c0 0%, #dcc4a8 100%); }
    .popup-des {
      text-align: left; margin: 8px 0; padding: 6px 8px;
      background: #f7f7f7; border-radius: 4px; font-size: 12px;
      max-height: 90px; overflow-y: auto;
    }
    .popup-gps { text-align: center; margin-top: 8px; padding-top: 6px; border-top: 1px solid #ddd; font-size: 11px; }
    .popup-gps a { color: #1a73e8; text-decoration: none; }
    .leaflet-popup-content { margin: 10px 12px; }
  
    .menu-btn {
      position: absolute; top: 12px; right: 12px; z-index: 1100;
      background: white; border: 1px solid #ccc; border-radius: 8px;
      padding: 8px 14px; font-size: 13px; font-weight: 600;
      color: #4a3728; text-decoration: none;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      font-family: "Hiragino Sans", Meiryo, sans-serif;
    }
    .menu-btn:hover { background: #f5f0e8; }
    
  </style>
</head>

ye": "チェディー", "er": "エラワン", "fm": "水上マーケット", "fu": "舟形お堂", "ga": "ガネーシャ", "gru": "ガルーダ", "ha": "ハヌマーン", "hi": "飛行機", "ho": "布袋・サンガッジイ", "irei": "慰霊碑", "je": "地獄絵", "ji": "立体地獄", "jr": "地獄絵レリーフ", "kc": "kc", "km": "クマントーン", "ko": "コンクリ像", "ku": "クメール遺跡", "kub": "クメール遺跡・施療院", "kuh": "クメール遺跡・宿駅", "kw": "観音", "lp": "高僧像", "lp.nh": "lp.nh", "me": "メンシーフーハーター", "mi": "ミイラ", "mp": "メー・ポーソップ", "mt": "メートラニ", "na": "ナーガ・コブラ他", "nb": "ナーガ仏", "ne": "涅槃仏", "nh": "nh", "nk": "招き女", "nn": "ナン・ナーク", "nt": "ナーン・タキアン", "pp": "プラ・ピッター", "rec": "お勧め", "rf": "ラフー", "sai": "最大・最長・最～", "sim": "シム", "sp": "珍・物・他", "ss": "ss", "st": "スントンプー", "su": "水上書庫", "ta": "立像", "tj": "タイの中の日本", "tm": "tm", "tt": "テープ・タンジャイ", "uk": "ウパクット", "ya": "ヤック", "ym": "ヤマ神", "yu": "天上天下唯我独尊", "za": "座像", "ｃye": "ｃye"}, "places": ["アムナットチャルン", "アユタヤ", "アントン", "ウタラディット", "ウドンタニ", "ウボンラチャタニ", "カムペンペット", "カラシン", "カンチャナブリ", "クラビ", "コンケン", "サケーオ", "サコンナコン", "サトゥン", "サムットサコン", "サムットソンクラム", "サムットプラカン", "サラブリ", "シンブリ", "シーサケット", "スコータイ", "スパンブリ", "スラタニ", "スリン", "ソンクラー", "ターク", "チェンマイ", "チェンライ", "チャイナート", "チャイヤプーム", "チャチュンサオ", "チャンタブリ", "チュンポン", "チョンブリ", "トラン", "トラート", "ナコンサワン", "ナコンシータマラート", "ナコンナヨック", "ナコンパトム", "ナコンパノム", "ナコンラチャシマ", "ナーン", "ノンカイ", "ノンタブリ", "ノンブアランプー", "バンコク", "パタルン", "パチュアップキリカン", "パトゥムタニ", "パヤオ", "パンガー", "ピサヌローク", "ピチット", "ブリラム", "ブンカン", "プラチンブリ", "プレー", "プーケット", "ペチャブリ", "ペチャブン", "マハサラカム", "ムクダハン", "メーホンソン", "ヤソートン", "ヤラー", "ラチャブリ", "ラノン", "ラヨーン", "ランパン", "ランプン", "ルーイ", "ロイエット", "ロブリ"]};
    const points = DATA.points;
    const tagMeanings = DATA.tagMeanings;
    const places = DATA.places;

    // Sort tags by meaning for display
    const sortedTags = Object.keys(tagMeanings).sort((a,b) => (tagMeanings[a]||a).localeCompare(tagMeanings[b]||b, 'ja'));

    let selectedTags = new Set();
    let selectedPlaces = new Set();

    const map = L.map('map').setView([13.75, 100.5], 6);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap', maxZoom: 19
    }).addTo(map);

    const markers = L.markerClusterGroup({ maxClusterRadius: 45, spiderfyOnMaxZoom: true, showCoverageOnHover: false });
    map.addLayer(markers);

    // Color by first tag
    const tagColors = {};
    const palette = ['#c45c26','#2a6a8a','#5a8a2a','#8a2a6a','#6a2a8a','#2a8a6a','#8a6a2a','#2a4a8a','#8a2a2a','#4a8a2a'];
    sortedTags.forEach((t,i) => { tagColors[t] = palette[i % palette.length]; });

    function escapeHtml(text) {
      if (!text) return '';
      return String(text).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function buildPopup(p) {
      let html = '<div class="popup-content"><div class="popup-center">';
      html += '<div class="name">' + escapeHtml(p.name) + '</div>';
      if (p.tname) html += '<div class="tname">' + escapeHtml(p.tname) + '</div>';
      html += '<div class="place">' + escapeHtml(p.place) + '</div>';
      if (p.link) {
        html += '<a href="' + escapeHtml(p.link) + '" target="_blank" rel="noopener" class="popup-image-placeholder">📷 写真を見る<br><span style="font-size:11px">' + escapeHtml(p.image||'') + '</span></a>';
      }
      if (p.date) html += '<div class="date">' + escapeHtml(p.date) + '</div>';
      html += '</div>';
      if (p.tags && p.tags.length) {
        html += '<div class="popup-tags">';
        p.tags.forEach(t => {
          html += '<span class="popup-tag">' + escapeHtml(tagMeanings[t] || t) + '</span>';
        });
        html += '</div>';
      }
      if (p.des) html += '<div class="popup-des">' + escapeHtml(p.des) + '</div>';
      const mapsUrl = 'https://www.google.com/maps?q=' + p.lat + ',' + p.lng;
      html += '<div class="popup-gps"><a href="' + mapsUrl + '" target="_blank" rel="noopener">📍 ' + escapeHtml(p.gps) + ' → Google Maps</a></div></div>';
      return html;
    }

    function matchesFilter(p) {
      // Tag filter: if any tags selected, point must have at least one of them
      if (selectedTags.size > 0) {
        const has = p.tags.some(t => selectedTags.has(t));
        if (!has) return false;
      }
      // Place filter
      if (selectedPlaces.size > 0) {
        if (!selectedPlaces.has(p.place)) return false;
      }
      return true;
    }

    function refreshMarkers() {
      markers.clearLayers();
      let count = 0;
      points.forEach(p => {
        if (!matchesFilter(p)) return;
        count++;
        const color = tagColors[p.tags[0]] || '#666';
        const marker = L.circleMarker([p.lat, p.lng], {
          radius: 7, fillColor: color, color: '#fff', weight: 1.5, opacity: 1, fillOpacity: 0.85
        });
        marker.bindPopup(buildPopup(p), { maxWidth: 300, minWidth: 200 });
        markers.addLayer(marker);
      });
      document.getElementById('count').textContent = count.toLocaleString() + ' / ' + points.length.toLocaleString() + ' 地点';
      document.getElementById('filterInfo').textContent =
        (selectedTags.size ? '像: ' + selectedTags.size + '種  ' : '') +
        (selectedPlaces.size ? '県: ' + selectedPlaces.size + '箇所' : '');
      if (count > 0 && (selectedTags.size > 0 || selectedPlaces.size > 0)) {
        try { map.fitBounds(markers.getBounds().pad(0.1)); } catch(e) {}
      }
    }

    // Build UI
    const tagList = document.getElementById('tagList');
    sortedTags.forEach(t => {
      const el = document.createElement('span');
      el.className = 'tag-item';
      el.textContent = tagMeanings[t] || t;
      el.dataset.tag = t;
      el.onclick = () => {
        if (selectedTags.has(t)) { selectedTags.delete(t); el.classList.remove('selected'); }
        else { selectedTags.add(t); el.classList.add('selected'); }
        refreshMarkers();
      };
      tagList.appendChild(el);
    });

    const placeList = document.getElementById('placeList');
    places.forEach(pl => {
      const el = document.createElement('span');
      el.className = 'place-item';
      el.textContent = pl;
      el.dataset.place = pl;
      el.onclick = () => {
        if (selectedPlaces.has(pl)) { selectedPlaces.delete(pl); el.classList.remove('selected'); }
        else { selectedPlaces.add(pl); el.classList.add('selected'); }
        refreshMarkers();
      };
      placeList.appendChild(el);
    });

    function selectAllTags() {
      selectedTags = new Set(sortedTags);
      document.querySelectorAll('.tag-item').forEach(el => el.classList.add('selected'));
      refreshMarkers();
    }
    function clearTags() {
      selectedTags.clear();
      document.querySelectorAll('.tag-item').forEach(el => el.classList.remove('selected'));
      refreshMarkers();
    }
    function selectAllPlaces() {
      selectedPlaces = new Set(places);
      document.querySelectorAll('.place-item').forEach(el => el.classList.add('selected'));
      refreshMarkers();
    }
    function clearPlaces() {
      selectedPlaces.clear();
      document.querySelectorAll('.place-item').forEach(el => el.classList.remove('selected'));
      refreshMarkers();
    }

    // Initial: show all
    refreshMarkers();
    map.fitBounds([[5.5,97.3],[20.5,105.7]]);
  </script>
</body>
