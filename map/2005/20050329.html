<!DOCTYPE html>
<html lang='ja'>
<head>
<meta charset='utf-8'>
<meta property="og:title" content="2005年3月29日の地図日記">
<meta property="og:type" content="website">
<title>2005年3月29日の地図日記</title>
<link rel='stylesheet' href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css' />
<script src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js'></script>
<style>
    body { display: flex; height: 100vh; margin: 0; background: #111; font-family: sans-serif; }
    #map { flex: 1; }
    #sidebar { width: 200px; overflow-y: auto; background: #111; padding: 10px; border-left: 1px solid #333; }
    .photo-thumb { margin-bottom: 10px; cursor: pointer; border: 2px solid transparent; min-height: 40px; background: #222; }
    .photo-thumb:hover { border-color: #007bff; }
    .photo-thumb img { width: 100%; border-radius: 4px; display: block; }
    .thumb-label { color: #ccc; font-size: 12px; text-align: center; padding: 4px 2px; word-break: break-word; }
</style>
</head>
<body>
<div id='map'></div>
<div id='sidebar'><div style='color:white; text-align:center; margin-bottom:15px;'>2005年3月29日</div><div class='photo-thumb'><img src='https://lek3map.github.io/thailand/picture/aruki.jpg' title='交通手段' alt='交通手段' onerror="this.style.display='none'"></div><div class='photo-thumb' onclick='moveToMarker(0)'><img src='https://lek3map.github.io/thailand/map/2005/thumbs/05032920.jpg' title='Bus Terminal' alt='Bus Terminal' onerror="this.style.display='none'"><div class='thumb-label'>Bus Terminal</div></div><div class='photo-thumb' onclick='moveToMarker(1)'><img src='https://lek3map.github.io/thailand/map/2005/thumbs/05032931.jpg' title='Post Office' alt='Post Office' onerror="this.style.display='none'"><div class='thumb-label'>Post Office</div></div><div class='photo-thumb' onclick='moveToMarker(2)'><img src='https://lek3map.github.io/thailand/map/2005/thumbs/05032948.jpg' title='Lak Muang' alt='Lak Muang' onerror="this.style.display='none'"><div class='thumb-label'>Lak Muang</div></div><div class='photo-thumb' onclick='moveToMarker(3)'><img src='https://lek3map.github.io/thailand/map/2005/thumbs/05032954.jpg' title='23rd Wing' alt='23rd Wing' onerror="this.style.display='none'"><div class='thumb-label'>23rd Wing</div></div><div class='photo-thumb' onclick='moveToMarker(4)'><img src='https://lek3map.github.io/thailand/map/2005/thumbs/05032959.jpg' title='Bus Terminal' alt='Bus Terminal' onerror="this.style.display='none'"><div class='thumb-label'>Bus Terminal</div></div><div class='photo-thumb' onclick='moveToMarker(5)'><img src='https://lek3map.github.io/thailand/map/2005/thumbs/05032962.jpg' title='Post Office' alt='Post Office' onerror="this.style.display='none'"><div class='thumb-label'>Post Office</div></div><div class='photo-thumb' onclick='moveToMarker(6)'><img src='https://lek3map.github.io/thailand/map/2005/thumbs/05032970.jpg' title='Lak Muang' alt='Lak Muang' onerror="this.style.display='none'"><div class='thumb-label'>Lak Muang</div></div></div>
<script>
var map = L.map('map');
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
}).addTo(map);

var markers = {};
var markerGroup = L.featureGroup().addTo(map);
var pathPoints = [];

var icon_bus_png = L.icon({
    iconUrl: 'https://lek3map.github.io/thailand/icon/bus.png',
    iconSize: [30, 30],
    iconAnchor: [15, 30],
    popupAnchor: [0, -30]
});
var icon_lakmuang_png = L.icon({
    iconUrl: 'https://lek3map.github.io/thailand/icon/lakmuang.png',
    iconSize: [30, 30],
    iconAnchor: [15, 30],
    popupAnchor: [0, -30]
});
var icon_postbox_png = L.icon({
    iconUrl: 'https://lek3map.github.io/thailand/icon/postbox.png',
    iconSize: [30, 30],
    iconAnchor: [15, 30],
    popupAnchor: [0, -30]
});
var icon_starr_png = L.icon({
    iconUrl: 'https://lek3map.github.io/thailand/icon/starr.png',
    iconSize: [30, 30],
    iconAnchor: [15, 30],
    popupAnchor: [0, -30]
});
markers[0] = L.marker([17.188519, 102.437854], {icon: icon_bus_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Bus Terminal</h3><a href='https://lek3map.github.io/thailand/map/2005/picture/05032920.jpg' target='_blank'><img src='https://lek3map.github.io/thailand/map/2005/thumbs/05032920.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>ノンブアランプー</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=17.188519,102.437854' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=17.188519,102.437854&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a></div>");
markers[1] = L.marker([17.200777, 102.441394], {icon: icon_postbox_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Post Office</h3><a href='https://lek3map.github.io/thailand/map/2005/picture/05032931.jpg' target='_blank'><img src='https://lek3map.github.io/thailand/map/2005/thumbs/05032931.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>ノンブアランプー</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=17.200777,102.441394' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=17.200777,102.441394&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a></div>");
markers[2] = L.marker([17.210449, 102.438768], {icon: icon_lakmuang_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Lak Muang</h3><a href='https://lek3map.github.io/thailand/map/2005/picture/05032948.jpg' target='_blank'><img src='https://lek3map.github.io/thailand/map/2005/thumbs/05032948.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>ノンブアランプー</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=17.210449,102.438768' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=17.210449,102.438768&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a></div>");
markers[3] = L.marker([17.379484, 102.8067], {icon: icon_starr_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>23rd Wing</h3><a href='https://lek3map.github.io/thailand/map/2005/picture/05032954.jpg' target='_blank'><img src='https://lek3map.github.io/thailand/map/2005/thumbs/05032954.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>ウドンタニ</div><div style='text-align:left; margin-top:8px;'>第２３航空団</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=17.379484,102.8067' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=17.379484,102.8067&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a></div>");
markers[4] = L.marker([17.884976, 102.755068], {icon: icon_bus_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Bus Terminal</h3><a href='https://lek3map.github.io/thailand/map/2005/picture/05032959.jpg' target='_blank'><img src='https://lek3map.github.io/thailand/map/2005/thumbs/05032959.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>ノンカイ</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=17.884976,102.755068' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=17.884976,102.755068&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a></div>");
markers[5] = L.marker([17.88382, 102.755068], {icon: icon_postbox_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Post Office</h3><a href='https://lek3map.github.io/thailand/map/2005/picture/05032962.jpg' target='_blank'><img src='https://lek3map.github.io/thailand/map/2005/thumbs/05032962.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>ノンカイ</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=17.88382,102.755068' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=17.88382,102.755068&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a></div>");
markers[6] = L.marker([17.866882, 102.746281], {icon: icon_lakmuang_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Lak Muang</h3><a href='https://lek3map.github.io/thailand/map/2005/picture/05032970.jpg' target='_blank'><img src='https://lek3map.github.io/thailand/map/2005/thumbs/05032970.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>ノンカイ</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=17.866882,102.746281' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=17.866882,102.746281&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a></div>");

if (pathPoints.length > 0) {
    var polyline = L.polyline(pathPoints, {color: '#ff0000', weight: 4, opacity: 0.8}).addTo(map);
    map.fitBounds(polyline.getBounds(), {padding: [30, 30]});
} else if (Object.keys(markers).length > 0) {
    map.fitBounds(markerGroup.getBounds(), {padding: [50, 50]});
} else {
    map.setView([13.7563, 100.5018], 6);
}

function moveToMarker(id) { 
    var m = markers[id]; 
    if(m) { map.flyTo(m.getLatLng(), 15); m.openPopup(); } 
}
</script>
</body>
</html>
