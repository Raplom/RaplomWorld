<style>

    #map { flex: 1; }
    #sidebar { width: 200px; overflow-y: auto; background: #111; padding: 10px; border-left: 1px solid #333; }
    .photo-thumb { margin-bottom: 10px; cursor: pointer; border: 2px solid transparent; min-height: 40px; background: #222; }
    .photo-thumb:hover { border-color: #007bff; }
    .photo-thumb img { width: 100%; border-radius: 4px; display: block; }

    iconUrl: 'https://lek3map.github.io/thailand/icon/tera.png',
    iconSize: [30, 30],
    iconAnchor: [15, 30],
    popupAnchor: [0, -30]
});
markers[0] = L.marker([14.893312, 100.39849], {icon: icon_bus_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Bus Terminal</h3><a href='https://lek3map.github.io/thailand/map/2005/picture/050902003.jpg' target='_blank'><img src='https://lek3map.github.io/thailand/map/2005/thumbs/050902003.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>シンブリ</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=14.893312,100.39849' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=14.893312,100.39849&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a></div>");

markers[6] = L.marker([15.388201, 100.023099], {icon: icon_bus_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Bus Terminal</h3><a href='https://lek3map.github.io/thailand/map/2005/picture/050902071.jpg' target='_blank'><img src='https://lek3map.github.io/thailand/map/2005/thumbs/050902071.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>ウタイタニ</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=15.388201,100.023099' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=15.388201,100.023099&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a></div>");
markers[7] = L.marker([15.384084, 100.025529], {icon: icon_clock_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Clock Tower<br>หอนาฬิกา</h3><a href='https://lek3map.github.io/thailand/map/2005/picture/050902084.jpg' target='_blank'><img src='https://lek3map.github.io/thailand/map/2005/thumbs/050902084.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>ウタイタニ</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=15.384084,100.025529' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=15.384084,100.025529&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a></div>");
markers[8] = L.marker([15.380854, 100.024502], {icon: icon_hyoushiki_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Road signs</h3><a href='https://lek3map.github.io/thailand/map/2005/picture/050902086.jpg' target='_blank'><img src='https://lek3map.github.io/thailand/map/2005/thumbs/050902086.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>ウタイタニ</div><div style='text-align:left; margin-top:8px;'>道路標識</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=15.380854,100.024502' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=15.380854,100.024502&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a></div>");

markers[11] = L.marker([15.378007, 100.033908], {icon: icon_postbox_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Post Office</h3><a href='https://lek3map.github.io/thailand/map/2005/picture/050902108.jpg' target='_blank'><img src='https://lek3map.github.io/thailand/map/2005/thumbs/050902108.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>ウタイタニ</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=15.378007,100.033908' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=15.378007,100.033908&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a></div>");

if (pathPoints.length > 0) {
    var polyline = L.polyline(pathPoints, {color: '#ff0000', weight: 4, opacity: 0.8}).addTo(map);
    map.fitBounds(polyline.getBounds(), {padding: [30, 30]});
} else if (Object.keys(markers).length > 0) {
    map.fitBounds(markerGroup.getBounds(), {padding: [50, 50]});
} else {
    map.setView([13.7563, 100.5018], 6);
}

function moveToMarker(id) { 
    var m = markers[id]; 
    if(m) { map.flyTo(m.getLatLng(), 15); m.openPopup(); } 
}
</script>
</body>
