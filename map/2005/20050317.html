<!DOCTYPE html>
<html lang='ja'>
<head>
<meta charset='utf-8'>
<meta property="og:title" content="2005年3月17日の地図日記">
<meta property="og:type" content="website">
<title>2005年3月17日の地図日記</title>
<link rel='stylesheet' href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css' />
<script src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js'></script>
<style>
    body { display: flex; height: 100vh; margin: 0; background: #111; font-family: sans-serif; }
    #map { flex: 1; }
    #sidebar { width: 200px; overflow-y: auto; background: #111; padding: 10px; border-left: 1px solid #333; }
    .photo-thumb { margin-bottom: 10px; cursor: pointer; border: 2px solid transparent; min-height: 40px; background: #222; }
    .photo-thumb:hover { border-color: #007bff; }
    .photo-thumb img { width: 100%; border-radius: 4px; display: block; }
    .thumb-label { color: #ccc; font-size: 12px; text-align: center; padding: 4px 2px; word-break: break-word; }
</style>
</head>
<body>
<div id='map'></div>
<div id='sidebar'><div style='color:white; text-align:center; margin-bottom:15px;'>2005年3月17日</div><div class='photo-thumb'><img src='https://lek3map.github.io/thailand/picture/aruki.jpg' title='交通手段' alt='交通手段' onerror="this.style.display='none'"></div><div class='photo-thumb' onclick='moveToMarker(0)'><img src='https://lek3map.github.io/thailand/map/2005/thumbs/05031705.jpg' title='Bus Terminal' alt='Bus Terminal' onerror="this.style.display='none'"><div class='thumb-label'>Bus Terminal</div></div><div class='photo-thumb' onclick='moveToMarker(1)'><img src='https://lek3map.github.io/thailand/map/2005/thumbs/05031723.jpg' title='Post Office' alt='Post Office' onerror="this.style.display='none'"><div class='thumb-label'>Post Office</div></div><div class='photo-thumb' onclick='moveToMarker(2)'><img src='https://lek3map.github.io/thailand/map/2005/thumbs/05031730.jpg' title='Phra Mae Thorani' alt='Phra Mae Thorani' onerror="this.style.display='none'"><div class='thumb-label'>Phra Mae Thorani</div></div><div class='photo-thumb' onclick='moveToMarker(3)'><img src='https://lek3map.github.io/thailand/map/2005/thumbs/05031737.jpg' title='Lak Muang' alt='Lak Muang' onerror="this.style.display='none'"><div class='thumb-label'>Lak Muang</div></div><div class='photo-thumb' onclick='moveToMarker(4)'><img src='https://lek3map.github.io/thailand/map/2005/thumbs/05031739.jpg' title='Khon Kaen Station' alt='Khon Kaen Station' onerror="this.style.display='none'"><div class='thumb-label'>Khon Kaen Station</div></div><div class='photo-thumb' onclick='moveToMarker(5)'><img src='https://lek3map.github.io/thailand/map/2005/thumbs/05031746.jpg' title='Bus Terminal' alt='Bus Terminal' onerror="this.style.display='none'"><div class='thumb-label'>Bus Terminal</div></div><div class='photo-thumb' onclick='moveToMarker(6)'><img src='https://lek3map.github.io/thailand/map/2005/thumbs/05031763.jpg' title='Lak Muang' alt='Lak Muang' onerror="this.style.display='none'"><div class='thumb-label'>Lak Muang</div></div><div class='photo-thumb' onclick='moveToMarker(7)'><img src='https://lek3map.github.io/thailand/map/2005/thumbs/05031769.jpg' title='Post Office' alt='Post Office' onerror="this.style.display='none'"><div class='thumb-label'>Post Office</div></div><div class='photo-thumb' onclick='moveToMarker(8)'><img src='https://lek3map.github.io/thailand/map/2005/thumbs/05031783.jpg' title='Udon Thani Station' alt='Udon Thani Station' onerror="this.style.display='none'"><div class='thumb-label'>Udon Thani Station</div></div></div>
<script>
var map = L.map('map');
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
}).addTo(map);

var markers = {};
var markerGroup = L.featureGroup().addTo(map);
var pathPoints = [];

var icon_bus_png = L.icon({
    iconUrl: 'https://lek3map.github.io/thailand/icon/bus.png',
    iconSize: [30, 30],
    iconAnchor: [15, 30],
    popupAnchor: [0, -30]
});
var icon_inori_png = L.icon({
    iconUrl: 'https://lek3map.github.io/thailand/icon/inori.png',
    iconSize: [30, 30],
    iconAnchor: [15, 30],
    popupAnchor: [0, -30]
});
var icon_lakmuang_png = L.icon({
    iconUrl: 'https://lek3map.github.io/thailand/icon/lakmuang.png',
    iconSize: [30, 30],
    iconAnchor: [15, 30],
    popupAnchor: [0, -30]
});
var icon_postbox_png = L.icon({
    iconUrl: 'https://lek3map.github.io/thailand/icon/postbox.png',
    iconSize: [30, 30],
    iconAnchor: [15, 30],
    popupAnchor: [0, -30]
});
var icon_station_png = L.icon({
    iconUrl: 'https://lek3map.github.io/thailand/icon/station.png',
    iconSize: [30, 30],
    iconAnchor: [15, 30],
    popupAnchor: [0, -30]
});
markers[0] = L.marker([16.439285, 102.833362], {icon: icon_bus_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Bus Terminal</h3><a href='https://photos.app.goo.gl/x89ac7ZZ1ZxLmREh1' target='_blank'><img src='https://lek3map.github.io/thailand/map/2005/thumbs/05031705.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>コンケン</div><div style='text-align:left; margin-top:8px;'>２０１７年末で閉鎖、第三バスターミナルへ移行</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=16.439285,102.833362' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=16.439285,102.833362&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a></div>");
markers[1] = L.marker([16.429834, 102.835786], {icon: icon_postbox_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Post Office</h3><a href='https://lek3map.github.io/thailand/map/2005/picture/05031723.jpg' target='_blank'><img src='https://lek3map.github.io/thailand/map/2005/thumbs/05031723.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>コンケン</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=16.429834,102.835786' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=16.429834,102.835786&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a></div>");
markers[2] = L.marker([16.430821, 102.829079], {icon: icon_inori_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Phra Mae Thorani<br>พระธรณี</h3><a href='https://photos.app.goo.gl/MtS8DWGY7iGznTIU2' target='_blank'><img src='https://lek3map.github.io/thailand/map/2005/thumbs/05031730.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>コンケン</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=16.430821,102.829079' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=16.430821,102.829079&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a></div>");
markers[3] = L.marker([16.431087, 102.828424], {icon: icon_lakmuang_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Lak Muang</h3><a href='https://photos.app.goo.gl/T9zW5RXVGr863udG8' target='_blank'><img src='https://lek3map.github.io/thailand/map/2005/thumbs/05031737.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>コンケン</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=16.431087,102.828424' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=16.431087,102.828424&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a></div>");
markers[4] = L.marker([16.426757, 102.825819], {icon: icon_station_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Khon Kaen Station</h3><a href='https://lek3map.github.io/thailand/map/2005/picture/05031739.jpg' target='_blank'><img src='https://lek3map.github.io/thailand/map/2005/thumbs/05031739.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>コンケン</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=16.426757,102.825819' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=16.426757,102.825819&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a></div>");
markers[5] = L.marker([17.403155, 102.800081], {icon: icon_bus_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Bus Terminal</h3><a href='https://lek3map.github.io/thailand/map/2005/picture/05031746.jpg' target='_blank'><img src='https://lek3map.github.io/thailand/map/2005/thumbs/05031746.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>ウドンタニ</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=17.403155,102.800081' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=17.403155,102.800081&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a></div>");
markers[6] = L.marker([17.413398, 102.787636], {icon: icon_lakmuang_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Lak Muang</h3><a href='https://lek3map.github.io/thailand/map/2005/picture/05031763.jpg' target='_blank'><img src='https://lek3map.github.io/thailand/map/2005/thumbs/05031763.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>ウドンタニ</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=17.413398,102.787636' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=17.413398,102.787636&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a></div>");
markers[7] = L.marker([17.416638, 102.787858], {icon: icon_postbox_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Post Office</h3><a href='https://lek3map.github.io/thailand/map/2005/picture/05031769.jpg' target='_blank'><img src='https://lek3map.github.io/thailand/map/2005/thumbs/05031769.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>ウドンタニ</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=17.416638,102.787858' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=17.416638,102.787858&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a></div>");
markers[8] = L.marker([17.404189, 102.805241], {icon: icon_station_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Udon Thani Station</h3><a href='https://lek3map.github.io/thailand/map/2005/picture/05031783.jpg' target='_blank'><img src='https://lek3map.github.io/thailand/map/2005/thumbs/05031783.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>ウドンタニ</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=17.404189,102.805241' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=17.404189,102.805241&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a></div>");

if (pathPoints.length > 0) {
    var polyline = L.polyline(pathPoints, {color: '#ff0000', weight: 4, opacity: 0.8}).addTo(map);
    map.fitBounds(polyline.getBounds(), {padding: [30, 30]});
} else if (Object.keys(markers).length > 0) {
    map.fitBounds(markerGroup.getBounds(), {padding: [50, 50]});
} else {
    map.setView([13.7563, 100.5018], 6);
}

function moveToMarker(id) { 
    var m = markers[id]; 
    if(m) { map.flyTo(m.getLatLng(), 15); m.openPopup(); } 
}
</script>
</body>
</html>
