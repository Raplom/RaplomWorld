<!DOCTYPE html>
<html lang='ja'>
<head>
<meta charset='utf-8'>
<meta property="og:title" content="2005年12月12日の地図日記">
<meta property="og:type" content="website">
<title>2005年12月12日の地図日記</title>
<link rel='stylesheet' href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css' />
<script src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js'></script>
<style>
    body { display: flex; height: 100vh; margin: 0; background: #111; font-family: sans-serif; }
    #map { flex: 1; }
    #sidebar { width: 200px; overflow-y: auto; background: #111; padding: 10px; border-left: 1px solid #333; }
    .photo-thumb { margin-bottom: 10px; cursor: pointer; border: 2px solid transparent; min-height: 40px; background: #222; }
    .photo-thumb:hover { border-color: #007bff; }
    .photo-thumb img { width: 100%; border-radius: 4px; display: block; }
    .thumb-label { color: #ccc; font-size: 12px; text-align: center; padding: 4px 2px; word-break: break-word; }
</style>
</head>
<body>
<div id='map'></div>
<div id='sidebar'><div style='color:white; text-align:center; margin-bottom:15px;'>2005年12月12日</div><div class='photo-thumb'><img src='https://lek3map.github.io/thailand/picture/aruki.jpg' title='交通手段' alt='交通手段' onerror="this.style.display='none'"></div><div class='photo-thumb' onclick='moveToMarker(0)'><img src='https://lek3map.github.io/thailand/map/2005/thumbs/051212002.jpg' title='Houses of Parliament' alt='Houses of Parliament' onerror="this.style.display='none'"><div class='thumb-label'>Houses of Parliament</div></div><div class='photo-thumb' onclick='moveToMarker(1)'><img src='https://lek3map.github.io/thailand/map/2005/thumbs/051212005.jpg' title='Dusit Zoo' alt='Dusit Zoo' onerror="this.style.display='none'"><div class='thumb-label'>Dusit Zoo</div></div><div class='photo-thumb' onclick='moveToMarker(2)'><img src='https://lek3map.github.io/thailand/map/2005/thumbs/051212012.jpg' title='Ananta Samakhom Throne Hall' alt='Ananta Samakhom Throne Hall' onerror="this.style.display='none'"><div class='thumb-label'>Ananta Samakhom Throne Hall</div></div><div class='photo-thumb' onclick='moveToMarker(3)'><img src='https://lek3map.github.io/thailand/map/2005/thumbs/051212015.jpg' title='Statue of King Rama V' alt='Statue of King Rama V' onerror="this.style.display='none'"><div class='thumb-label'>Statue of King Rama V</div></div><div class='photo-thumb' onclick='moveToMarker(4)'><img src='https://lek3map.github.io/thailand/map/2005/thumbs/051212075.jpg' title='Wat Benchamabophit' alt='Wat Benchamabophit' onerror="this.style.display='none'"><div class='thumb-label'>Wat Benchamabophit</div></div><div class='photo-thumb' onclick='moveToMarker(5)'><img src='https://lek3map.github.io/thailand/map/2005/thumbs/051212093.jpg' title='Thawet Market' alt='Thawet Market' onerror="this.style.display='none'"><div class='thumb-label'>Thawet Market</div></div><div class='photo-thumb' onclick='moveToMarker(6)'><img src='https://lek3map.github.io/thailand/map/2005/thumbs/051212096.jpg' title='Wat Indrawihan' alt='Wat Indrawihan' onerror="this.style.display='none'"><div class='thumb-label'>Wat Indrawihan</div></div></div>
<script>
var map = L.map('map');
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
}).addTo(map);

var markers = {};
var markerGroup = L.featureGroup().addTo(map);
var pathPoints = [];

var icon_market_png = L.icon({
    iconUrl: 'https://lek3map.github.io/thailand/icon/market.png',
    iconSize: [30, 30],
    iconAnchor: [15, 30],
    popupAnchor: [0, -30]
});
var icon_monument_png = L.icon({
    iconUrl: 'https://lek3map.github.io/thailand/icon/monument.png',
    iconSize: [30, 30],
    iconAnchor: [15, 30],
    popupAnchor: [0, -30]
});
var icon_parks_png = L.icon({
    iconUrl: 'https://lek3map.github.io/thailand/icon/parks.png',
    iconSize: [30, 30],
    iconAnchor: [15, 30],
    popupAnchor: [0, -30]
});
var icon_tera_png = L.icon({
    iconUrl: 'https://lek3map.github.io/thailand/icon/tera.png',
    iconSize: [30, 30],
    iconAnchor: [15, 30],
    popupAnchor: [0, -30]
});
var icon_yakata_png = L.icon({
    iconUrl: 'https://lek3map.github.io/thailand/icon/yakata.png',
    iconSize: [30, 30],
    iconAnchor: [15, 30],
    popupAnchor: [0, -30]
});
markers[0] = L.marker([13.774395, 100.514066], {icon: icon_yakata_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Houses of Parliament</h3><a href='https://lek3map.github.io/thailand/map/2005/picture/051212002.jpg' target='_blank'><img src='https://lek3map.github.io/thailand/map/2005/thumbs/051212002.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>バンコク</div><div style='text-align:left; margin-top:8px;'>国会議事堂</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=13.774395,100.514066' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=13.774395,100.514066&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a></div>");
markers[1] = L.marker([13.770951, 100.516062], {icon: icon_parks_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Dusit Zoo<br>สวนสัตว์ดุสิต</h3><a href='https://lek3map.github.io/thailand/map/2005/picture/051212005.jpg' target='_blank'><img src='https://lek3map.github.io/thailand/map/2005/thumbs/051212005.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>バンコク</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=13.770951,100.516062' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=13.770951,100.516062&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a></div>");
markers[2] = L.marker([13.771711, 100.513036], {icon: icon_yakata_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Ananta Samakhom Throne Hall</h3><a href='https://lek3map.github.io/thailand/map/2005/picture/051212012.jpg' target='_blank'><img src='https://lek3map.github.io/thailand/map/2005/thumbs/051212012.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>バンコク</div><div style='text-align:left; margin-top:8px;'>アナンタ・サマコム宮殿　ラーマ5世によって着工され、1915年ラーマ6世の時に完成しました。1932年から国会議事堂として使用されてきましたが、現在は新国会議事堂が出来たため使用されていません。</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=13.771711,100.513036' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=13.771711,100.513036&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a></div>");
markers[3] = L.marker([13.769226, 100.512006], {icon: icon_monument_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Statue of King Rama V<br>พระบรมรูปทรงม้ารัชกาลที่ 5</h3><a href='https://lek3map.github.io/thailand/map/2005/picture/051212015.jpg' target='_blank'><img src='https://lek3map.github.io/thailand/map/2005/thumbs/051212015.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>バンコク</div><div style='text-align:left; margin-top:8px;'>ラーマⅤ世像:プラ・チュラロンコーン 1853年-1910年  王位：1868年-1910年 １９０７年ヨーロッパに外遊した際にフランス人彫刻家によって製作された。</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=13.769226,100.512006' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=13.769226,100.512006&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a></div>");
markers[4] = L.marker([13.766592, 100.514106], {icon: icon_tera_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Wat Benchamabophit<br>วัดเบญจมบพิตรดุสิตวนารามราชวรวิหาร</h3><a href='https://goo.gl/photos/GE1xLb9mktRo9o9NA' target='_blank'><img src='https://lek3map.github.io/thailand/map/2005/thumbs/051212075.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>バンコク</div><div style='text-align:left; margin-top:8px;'>大理石寺院 ： 第一級王室仏教寺院 1899年、ラーマ5世の命により現在の本堂が建立された、大理石寺院の別名のとおり、屋根瓦以外のほとんどの建材にイタリア、カラーラ産の大理石を使用している。屋根には鮮やかなオレンジ色の瓦が使われ、窓にはステンドグラスがはめ込まれている。本尊仏は、ピッサヌローク県のワット・プラシー・ラタナマハタートのチナラート仏を模したものである　敷地内に国立博物館を付設している。</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=13.766592,100.514106' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=13.766592,100.514106&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a></div>");
markers[5] = L.marker([13.770211, 100.504002], {icon: icon_market_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Thawet Market<br>ตลาดเทวราช</h3><a href='https://goo.gl/photos/pXRzEzbUckbMLqnF8' target='_blank'><img src='https://lek3map.github.io/thailand/map/2005/thumbs/051212093.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>バンコク</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=13.770211,100.504002' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=13.770211,100.504002&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a></div>");
markers[6] = L.marker([13.767116, 100.50294], {icon: icon_tera_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Wat Indrawihan<br>วัดอินทรวิหาร</h3><a href='https://goo.gl/photos/j68422s1g1yHJRkh8' target='_blank'><img src='https://lek3map.github.io/thailand/map/2005/thumbs/051212096.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>バンコク</div><div style='text-align:left; margin-top:8px;'>第三級王室仏教寺院</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=13.767116,100.50294' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=13.767116,100.50294&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a></div>");

if (pathPoints.length > 0) {
    var polyline = L.polyline(pathPoints, {color: '#ff0000', weight: 4, opacity: 0.8}).addTo(map);
    map.fitBounds(polyline.getBounds(), {padding: [30, 30]});
} else if (Object.keys(markers).length > 0) {
    map.fitBounds(markerGroup.getBounds(), {padding: [50, 50]});
} else {
    map.setView([13.7563, 100.5018], 6);
}

function moveToMarker(id) { 
    var m = markers[id]; 
    if(m) { map.flyTo(m.getLatLng(), 15); m.openPopup(); } 
}
</script>
</body>
</html>
