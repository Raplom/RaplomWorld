<!DOCTYPE html>
<html lang='ja'>
<head>
<meta charset='utf-8'>
<meta property="og:title" content="2005年8月23日の地図日記">
<meta property="og:type" content="website">
<title>2005年8月23日の地図日記</title>
<link rel='stylesheet' href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css' />
<script src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js'></script>
<style>
    body { display: flex; height: 100vh; margin: 0; background: #111; font-family: sans-serif; }
    #map { flex: 1; }
    #sidebar { width: 200px; overflow-y: auto; background: #111; padding: 10px; border-left: 1px solid #333; }
    .photo-thumb { margin-bottom: 10px; cursor: pointer; border: 2px solid transparent; min-height: 40px; background: #222; }
    .photo-thumb:hover { border-color: #007bff; }
    .photo-thumb img { width: 100%; border-radius: 4px; display: block; }
    .thumb-label { color: #ccc; font-size: 12px; text-align: center; padding: 4px 2px; word-break: break-word; }
</style>
</head>
<body>
<div id='map'></div>
<div id='sidebar'><div style='color:white; text-align:center; margin-bottom:15px;'>2005年8月23日</div><div class='photo-thumb'><img src='https://lek3map.github.io/thailand/picture/aruki.jpg' title='交通手段' alt='交通手段' onerror="this.style.display='none'"></div><div class='photo-thumb' onclick='moveToMarker(0)'><img src='https://lek3map.github.io/thailand/map/2005/thumbs/050823014.jpg' title='Chum Phae Bus Terminal' alt='Chum Phae Bus Terminal' onerror="this.style.display='none'"><div class='thumb-label'>Chum Phae Bus Terminal</div></div><div class='photo-thumb' onclick='moveToMarker(1)'><img src='https://lek3map.github.io/thailand/map/2005/thumbs/050823078.jpg' title='Wat Phra Si Rattana Mahathat' alt='Wat Phra Si Rattana Mahathat' onerror="this.style.display='none'"><div class='thumb-label'>Wat Phra Si Rattana Mahathat</div></div><div class='photo-thumb' onclick='moveToMarker(2)'><img src='https://lek3map.github.io/thailand/map/2005/thumbs/050823046.jpg' title='Bus Terminal' alt='Bus Terminal' onerror="this.style.display='none'"><div class='thumb-label'>Bus Terminal</div></div><div class='photo-thumb' onclick='moveToMarker(3)'><img src='https://lek3map.github.io/thailand/map/2005/thumbs/050823053.jpg' title='Clock Tower' alt='Clock Tower' onerror="this.style.display='none'"><div class='thumb-label'>Clock Tower</div></div><div class='photo-thumb' onclick='moveToMarker(4)'><img src='https://lek3map.github.io/thailand/map/2005/thumbs/050823113.jpg' title='Lak Muang' alt='Lak Muang' onerror="this.style.display='none'"><div class='thumb-label'>Lak Muang</div></div><div class='photo-thumb' onclick='moveToMarker(5)'><img src='https://lek3map.github.io/thailand/map/2005/thumbs/050823133.jpg' title='Phitsanulok Station' alt='Phitsanulok Station' onerror="this.style.display='none'"><div class='thumb-label'>Phitsanulok Station</div></div></div>
<script>
var map = L.map('map');
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
}).addTo(map);

var markers = {};
var markerGroup = L.featureGroup().addTo(map);
var pathPoints = [];

var icon_bus_png = L.icon({
    iconUrl: 'https://lek3map.github.io/thailand/icon/bus.png',
    iconSize: [30, 30],
    iconAnchor: [15, 30],
    popupAnchor: [0, -30]
});
var icon_clock_png = L.icon({
    iconUrl: 'https://lek3map.github.io/thailand/icon/clock.png',
    iconSize: [30, 30],
    iconAnchor: [15, 30],
    popupAnchor: [0, -30]
});
var icon_iseki_png = L.icon({
    iconUrl: 'https://lek3map.github.io/thailand/icon/iseki.png',
    iconSize: [30, 30],
    iconAnchor: [15, 30],
    popupAnchor: [0, -30]
});
var icon_lakmuang_png = L.icon({
    iconUrl: 'https://lek3map.github.io/thailand/icon/lakmuang.png',
    iconSize: [30, 30],
    iconAnchor: [15, 30],
    popupAnchor: [0, -30]
});
var icon_station_png = L.icon({
    iconUrl: 'https://lek3map.github.io/thailand/icon/station.png',
    iconSize: [30, 30],
    iconAnchor: [15, 30],
    popupAnchor: [0, -30]
});
markers[0] = L.marker([16.542387, 102.100191], {icon: icon_bus_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Chum Phae Bus Terminal</h3><a href='https://lek3map.github.io/thailand/map/2005/picture/050823014.jpg' target='_blank'><img src='https://lek3map.github.io/thailand/map/2005/thumbs/050823014.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>コンケン</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=16.542387,102.100191' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=16.542387,102.100191&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a></div>");
markers[1] = L.marker([16.823839, 100.26226], {icon: icon_iseki_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Wat Phra Si Rattana Mahathat<br>วัดพระศรีรัตนมหาธาตุ</h3><a href='https://goo.gl/photos/ffTrWFfomfBjYu559' target='_blank'><img src='https://lek3map.github.io/thailand/map/2005/thumbs/050823078.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>ピサヌローク</div><div style='text-align:left; margin-top:8px;'>県章元の仏像があるお寺 クメール遺跡: タイで最も美しい仏像のあるお寺</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=16.823839,100.26226' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=16.823839,100.26226&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a></div>");
markers[2] = L.marker([16.818663, 100.279266], {icon: icon_bus_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Bus Terminal</h3><a href='https://lek3map.github.io/thailand/map/2005/picture/050823046.jpg' target='_blank'><img src='https://lek3map.github.io/thailand/map/2005/thumbs/050823046.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>ピサヌローク</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=16.818663,100.279266' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=16.818663,100.279266&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a></div>");
markers[3] = L.marker([16.813492, 100.262754], {icon: icon_clock_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Clock Tower<br>หอนาฬิกา</h3><a href='https://lek3map.github.io/thailand/map/2005/picture/050823053.jpg' target='_blank'><img src='https://lek3map.github.io/thailand/map/2005/thumbs/050823053.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>ピサヌローク</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=16.813492,100.262754' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=16.813492,100.262754&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a></div>");
markers[4] = L.marker([16.824686, 100.260101], {icon: icon_lakmuang_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Lak Muang</h3><a href='https://lek3map.github.io/thailand/map/2005/picture/050823113.jpg' target='_blank'><img src='https://lek3map.github.io/thailand/map/2005/thumbs/050823113.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>ピサヌローク</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=16.824686,100.260101' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=16.824686,100.260101&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a></div>");
markers[5] = L.marker([16.815027, 100.265388], {icon: icon_station_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Phitsanulok Station</h3><a href='https://lek3map.github.io/thailand/map/2005/picture/050823133.jpg' target='_blank'><img src='https://lek3map.github.io/thailand/map/2005/thumbs/050823133.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>ピサヌローク</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=16.815027,100.265388' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=16.815027,100.265388&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a></div>");

if (pathPoints.length > 0) {
    var polyline = L.polyline(pathPoints, {color: '#ff0000', weight: 4, opacity: 0.8}).addTo(map);
    map.fitBounds(polyline.getBounds(), {padding: [30, 30]});
} else if (Object.keys(markers).length > 0) {
    map.fitBounds(markerGroup.getBounds(), {padding: [50, 50]});
} else {
    map.setView([13.7563, 100.5018], 6);
}

function moveToMarker(id) { 
    var m = markers[id]; 
    if(m) { map.flyTo(m.getLatLng(), 15); m.openPopup(); } 
}
</script>
</body>
</html>
