<!DOCTYPE html>
<html lang='ja'>
<head>
<meta charset='utf-8'>
<meta property="og:title" content="2005年7月24日の地図日記">
<meta property="og:type" content="website">
<title>2005年7月24日の地図日記</title>
<link rel='stylesheet' href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css' />
<script src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js'></script>
<style>
    body { display: flex; height: 100vh; margin: 0; background: #111; font-family: sans-serif; }
    #map { flex: 1; }
    #sidebar { width: 200px; overflow-y: auto; background: #111; padding: 10px; border-left: 1px solid #333; }
    .photo-thumb { margin-bottom: 10px; cursor: pointer; border: 2px solid transparent; min-height: 40px; background: #222; }
    .photo-thumb:hover { border-color: #007bff; }
    .photo-thumb img { width: 100%; border-radius: 4px; display: block; }
    .thumb-label { color: #ccc; font-size: 12px; text-align: center; padding: 4px 2px; word-break: break-word; }
</style>
</head>
<body>
<div id='map'></div>
<div id='sidebar'><div style='color:white; text-align:center; margin-bottom:15px;'>2005年7月24日</div><div class='photo-thumb'><img src='https://lek3map.github.io/thailand/picture/aruki.jpg' title='交通手段' alt='交通手段' onerror="this.style.display='none'"></div><div class='photo-thumb' onclick='moveToMarker(0)'><img src='https://lek3map.github.io/thailand/map/2005/thumbs/050724007.jpg' title='Lak Muang' alt='Lak Muang' onerror="this.style.display='none'"><div class='thumb-label'>Lak Muang</div></div><div class='photo-thumb' onclick='moveToMarker(1)'><img src='https://lek3map.github.io/thailand/map/2005/thumbs/050724012.jpg' title='Post Office' alt='Post Office' onerror="this.style.display='none'"><div class='thumb-label'>Post Office</div></div><div class='photo-thumb' onclick='moveToMarker(2)'><img src='https://lek3map.github.io/thailand/map/2005/thumbs/050724018.jpg' title='Samut Songkhram City Hall' alt='Samut Songkhram City Hall' onerror="this.style.display='none'"><div class='thumb-label'>Samut Songkhram City Hall</div></div><div class='photo-thumb' onclick='moveToMarker(3)'><img src='https://lek3map.github.io/thailand/map/2005/thumbs/050724024.jpg' title='Maeklong Railway Market' alt='Maeklong Railway Market' onerror="this.style.display='none'"><div class='thumb-label'>Maeklong Railway Market</div></div><div class='photo-thumb' onclick='moveToMarker(4)'><img src='https://lek3map.github.io/thailand/map/2005/thumbs/050724027.jpg' title='Mae Klong Station' alt='Mae Klong Station' onerror="this.style.display='none'"><div class='thumb-label'>Mae Klong Station</div></div><div class='photo-thumb' onclick='moveToMarker(5)'><img src='https://lek3map.github.io/thailand/map/2005/thumbs/050724090.jpg' title='Ban Laem Station' alt='Ban Laem Station' onerror="this.style.display='none'"><div class='thumb-label'>Ban Laem Station</div></div><div class='photo-thumb' onclick='moveToMarker(6)'><img src='https://lek3map.github.io/thailand/map/2005/thumbs/050724098.jpg' title='Clock Tower' alt='Clock Tower' onerror="this.style.display='none'"><div class='thumb-label'>Clock Tower</div></div><div class='photo-thumb' onclick='moveToMarker(7)'><img src='https://lek3map.github.io/thailand/map/2005/thumbs/050724120.jpg' title='Post Office' alt='Post Office' onerror="this.style.display='none'"><div class='thumb-label'>Post Office</div></div><div class='photo-thumb' onclick='moveToMarker(8)'><img src='https://lek3map.github.io/thailand/map/2005/thumbs/050724131.jpg' title='Lak Muang' alt='Lak Muang' onerror="this.style.display='none'"><div class='thumb-label'>Lak Muang</div></div><div class='photo-thumb' onclick='moveToMarker(9)'><img src='https://lek3map.github.io/thailand/map/2005/thumbs/050724140.jpg' title='Victory Monument' alt='Victory Monument' onerror="this.style.display='none'"><div class='thumb-label'>Victory Monument</div></div></div>
<script>
var map = L.map('map');
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
}).addTo(map);

var markers = {};
var markerGroup = L.featureGroup().addTo(map);
var pathPoints = [];

var icon_clock_png = L.icon({
    iconUrl: 'https://lek3map.github.io/thailand/icon/clock.png',
    iconSize: [30, 30],
    iconAnchor: [15, 30],
    popupAnchor: [0, -30]
});
var icon_lakmuang_png = L.icon({
    iconUrl: 'https://lek3map.github.io/thailand/icon/lakmuang.png',
    iconSize: [30, 30],
    iconAnchor: [15, 30],
    popupAnchor: [0, -30]
});
var icon_market_png = L.icon({
    iconUrl: 'https://lek3map.github.io/thailand/icon/market.png',
    iconSize: [30, 30],
    iconAnchor: [15, 30],
    popupAnchor: [0, -30]
});
var icon_monument_png = L.icon({
    iconUrl: 'https://lek3map.github.io/thailand/icon/monument.png',
    iconSize: [30, 30],
    iconAnchor: [15, 30],
    popupAnchor: [0, -30]
});
var icon_postbox_png = L.icon({
    iconUrl: 'https://lek3map.github.io/thailand/icon/postbox.png',
    iconSize: [30, 30],
    iconAnchor: [15, 30],
    popupAnchor: [0, -30]
});
var icon_starr_png = L.icon({
    iconUrl: 'https://lek3map.github.io/thailand/icon/starr.png',
    iconSize: [30, 30],
    iconAnchor: [15, 30],
    popupAnchor: [0, -30]
});
var icon_station_png = L.icon({
    iconUrl: 'https://lek3map.github.io/thailand/icon/station.png',
    iconSize: [30, 30],
    iconAnchor: [15, 30],
    popupAnchor: [0, -30]
});
markers[0] = L.marker([13.411931, 100.002645], {icon: icon_lakmuang_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Lak Muang</h3><a href='https://lek3map.github.io/thailand/map/2005/picture/050724007.jpg' target='_blank'><img src='https://lek3map.github.io/thailand/map/2005/thumbs/050724007.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>サムットソンクラム</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=13.411931,100.002645' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=13.411931,100.002645&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a></div>");
markers[1] = L.marker([13.412142, 100.000294], {icon: icon_postbox_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Post Office</h3><a href='https://lek3map.github.io/thailand/map/2005/picture/050724012.jpg' target='_blank'><img src='https://lek3map.github.io/thailand/map/2005/thumbs/050724012.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>サムットソンクラム</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=13.412142,100.000294' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=13.412142,100.000294&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a></div>");
markers[2] = L.marker([13.41268, 100.00172], {icon: icon_starr_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Samut Songkhram City Hall</h3><a href='https://lek3map.github.io/thailand/map/2005/picture/050724018.jpg' target='_blank'><img src='https://lek3map.github.io/thailand/map/2005/thumbs/050724018.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>サムットソンクラム</div><div style='text-align:left; margin-top:8px;'>左の高い塔は水タンク、県のシンボルがタイコなのでそんな形のタンクにしたらしい</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=13.41268,100.00172' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=13.41268,100.00172&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a></div>");
markers[3] = L.marker([13.407443, 99.998853], {icon: icon_market_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Maeklong Railway Market<br>ตลาดแม่กลอง</h3><a href='https://goo.gl/photos/HwG6oRf3YHpbiSJM9' target='_blank'><img src='https://lek3map.github.io/thailand/map/2005/thumbs/050724024.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>サムットソンクラム</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=13.407443,99.998853' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=13.407443,99.998853&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a></div>");
markers[4] = L.marker([13.407571, 99.998481], {icon: icon_station_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Mae Klong Station</h3><a href='https://goo.gl/photos/HwG6oRf3YHpbiSJM9' target='_blank'><img src='https://lek3map.github.io/thailand/map/2005/thumbs/050724027.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>サムットソンクラム</div><div style='text-align:left; margin-top:8px;'>この駅は線路上に市場があるという事で有名</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=13.407571,99.998481' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=13.407571,99.998481&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a></div>");
markers[5] = L.marker([13.542121, 100.270092], {icon: icon_station_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Ban Laem Station</h3><a href='https://photos.app.goo.gl/zp6sRZF5KBFsqUG3A' target='_blank'><img src='https://lek3map.github.io/thailand/map/2005/thumbs/050724090.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>サムットサコン</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=13.542121,100.270092' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=13.542121,100.270092&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a></div>");
markers[6] = L.marker([13.544452, 100.275108], {icon: icon_clock_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Clock Tower<br>หอนาฬิกา</h3><a href='https://lek3map.github.io/thailand/map/2005/picture/050724098.jpg' target='_blank'><img src='https://lek3map.github.io/thailand/map/2005/thumbs/050724098.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>サムットサコン</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=13.544452,100.275108' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=13.544452,100.275108&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a></div>");
markers[7] = L.marker([13.547044, 100.276948], {icon: icon_postbox_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Post Office</h3><a href='https://lek3map.github.io/thailand/map/2005/picture/050724120.jpg' target='_blank'><img src='https://lek3map.github.io/thailand/map/2005/thumbs/050724120.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>サムットサコン</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=13.547044,100.276948' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=13.547044,100.276948&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a></div>");
markers[8] = L.marker([13.545177, 100.274186], {icon: icon_lakmuang_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Lak Muang</h3><a href='https://lek3map.github.io/thailand/map/2005/picture/050724131.jpg' target='_blank'><img src='https://lek3map.github.io/thailand/map/2005/thumbs/050724131.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>サムットサコン</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=13.545177,100.274186' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=13.545177,100.274186&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a></div>");
markers[9] = L.marker([13.764954, 100.538303], {icon: icon_monument_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Victory Monument<br>อนุสาวรีย์ชัยสมรภูมิ</h3><a href='https://lek3map.github.io/thailand/map/2005/picture/050724140.jpg' target='_blank'><img src='https://lek3map.github.io/thailand/map/2005/thumbs/050724140.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>バンコク</div><div style='text-align:left; margin-top:8px;'>戦勝記念塔：1940年に起こったタイ・フランス領インドシナ紛争でフランス軍と戦って戦死したタイ軍兵士を慰霊するために、1941年に建てられた。</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=13.764954,100.538303' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=13.764954,100.538303&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a></div>");

if (pathPoints.length > 0) {
    var polyline = L.polyline(pathPoints, {color: '#ff0000', weight: 4, opacity: 0.8}).addTo(map);
    map.fitBounds(polyline.getBounds(), {padding: [30, 30]});
} else if (Object.keys(markers).length > 0) {
    map.fitBounds(markerGroup.getBounds(), {padding: [50, 50]});
} else {
    map.setView([13.7563, 100.5018], 6);
}

function moveToMarker(id) { 
    var m = markers[id]; 
    if(m) { map.flyTo(m.getLatLng(), 15); m.openPopup(); } 
}
</script>
</body>
</html>
