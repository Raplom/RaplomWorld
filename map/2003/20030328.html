<!DOCTYPE html>
<html lang='ja'>
<head>
<meta charset='utf-8'>
<meta property="og:title" content="2003年3月28日の地図日記">
<meta property="og:type" content="website">
<title>2003年3月28日の地図日記</title>
<link rel='stylesheet' href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css' />
<script src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js'></script>
<style>
    body { display: flex; height: 100vh; margin: 0; background: #111; font-family: sans-serif; }
    #map { flex: 1; }
    #sidebar { width: 200px; overflow-y: auto; background: #111; padding: 10px; border-left: 1px solid #333; }
    .photo-thumb { margin-bottom: 10px; cursor: pointer; border: 2px solid transparent; min-height: 40px; background: #222; }
    .photo-thumb:hover { border-color: #007bff; }
    .photo-thumb img { width: 100%; border-radius: 4px; display: block; }
    .thumb-label { color: #ccc; font-size: 12px; text-align: center; padding: 4px 2px; word-break: break-word; }
</style>
</head>
<body>
<div id='map'></div>
<div id='sidebar'><div style='color:white; text-align:center; margin-bottom:15px;'>2003年3月28日</div><div class='photo-thumb'><img src='https://lek3map.github.io/thailand/picture/aruki.jpg' title='交通手段' alt='交通手段' onerror="this.style.display='none'"></div><div class='photo-thumb' onclick='moveToMarker(0)'><img src='https://lek3map.github.io/thailand/map/2003/thumbs/03032812.jpg' title='Wat Phra Phai Luang' alt='Wat Phra Phai Luang' onerror="this.style.display='none'"><div class='thumb-label'>Wat Phra Phai Luang</div></div><div class='photo-thumb' onclick='moveToMarker(1)'><img src='https://lek3map.github.io/thailand/map/2003/thumbs/03032821.jpg' title='Wat Sri Chum' alt='Wat Sri Chum' onerror="this.style.display='none'"><div class='thumb-label'>Wat Sri Chum</div></div><div class='photo-thumb' onclick='moveToMarker(2)'><img src='https://lek3map.github.io/thailand/map/2003/thumbs/03032831.jpg' title='Wat Saphan Hin' alt='Wat Saphan Hin' onerror="this.style.display='none'"><div class='thumb-label'>Wat Saphan Hin</div></div><div class='photo-thumb' onclick='moveToMarker(3)'><img src='https://lek3map.github.io/thailand/map/2003/thumbs/03032838.jpg' title='Wat Chetuphon' alt='Wat Chetuphon' onerror="this.style.display='none'"><div class='thumb-label'>Wat Chetuphon</div></div><div class='photo-thumb' onclick='moveToMarker(4)'><img src='https://lek3map.github.io/thailand/map/2003/thumbs/03032850.jpg' title='Wat Mahathat' alt='Wat Mahathat' onerror="this.style.display='none'"><div class='thumb-label'>Wat Mahathat</div></div><div class='photo-thumb' onclick='moveToMarker(5)'><img src='https://lek3map.github.io/thailand/map/2003/thumbs/03032853.jpg' title='Wat Sri Sawai' alt='Wat Sri Sawai' onerror="this.style.display='none'"><div class='thumb-label'>Wat Sri Sawai</div></div><div class='photo-thumb' onclick='moveToMarker(6)'><img src='https://lek3map.github.io/thailand/map/2003/thumbs/03032861.jpg' title='Wat Traphang Ngoen' alt='Wat Traphang Ngoen' onerror="this.style.display='none'"><div class='thumb-label'>Wat Traphang Ngoen</div></div><div class='photo-thumb' onclick='moveToMarker(7)'><img src='https://lek3map.github.io/thailand/map/2003/thumbs/03032866.jpg' title='Wat Sa-Sri' alt='Wat Sa-Sri' onerror="this.style.display='none'"><div class='thumb-label'>Wat Sa-Sri</div></div><div class='photo-thumb' onclick='moveToMarker(8)'><img src='https://lek3map.github.io/thailand/map/2003/thumbs/03032873.jpg' title='Wat Chana Songkhram' alt='Wat Chana Songkhram' onerror="this.style.display='none'"><div class='thumb-label'>Wat Chana Songkhram</div></div><div class='photo-thumb' onclick='moveToMarker(9)'><img src='https://lek3map.github.io/thailand/map/2003/thumbs/03032878.jpg' title='Monument of King Ramkhamhaeng the Great' alt='Monument of King Ramkhamhaeng the Great' onerror="this.style.display='none'"><div class='thumb-label'>Monument of King Ramkhamhaeng the Great</div></div></div>
<script>
var map = L.map('map');
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
}).addTo(map);

var markers = {};
var markerGroup = L.featureGroup().addTo(map);
var pathPoints = [];

var icon_iseki_png = L.icon({
    iconUrl: 'https://lek3map.github.io/thailand/icon/iseki.png',
    iconSize: [30, 30],
    iconAnchor: [15, 30],
    popupAnchor: [0, -30]
});
var icon_monument_png = L.icon({
    iconUrl: 'https://lek3map.github.io/thailand/icon/monument.png',
    iconSize: [30, 30],
    iconAnchor: [15, 30],
    popupAnchor: [0, -30]
});
markers[0] = L.marker([17.029166, 99.699459], {icon: icon_iseki_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Wat Phra Phai Luang<br>โบราณสถานวัดพระพายหลวง</h3><a href='https://photos.app.goo.gl/vXgwftzPWEkjtTZx5' target='_blank'><img src='https://lek3map.github.io/thailand/map/2003/thumbs/03032812.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>スコータイ</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=17.029166,99.699459' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=17.029166,99.699459&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a></div>");
markers[1] = L.marker([17.026841, 99.693186], {icon: icon_iseki_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Wat Sri Chum<br>วัดศรีชุม</h3><a href='https://photos.app.goo.gl/Exie1TA1cXMhdLXj7' target='_blank'><img src='https://lek3map.github.io/thailand/map/2003/thumbs/03032821.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>スコータイ</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=17.026841,99.693186' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=17.026841,99.693186&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a></div>");
markers[2] = L.marker([17.023121, 99.675302], {icon: icon_iseki_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Wat Saphan Hin<br>โบราณสถานวัดสะพานหิน</h3><a href='https://photos.app.goo.gl/b8sYNrhZXZqkyibx7' target='_blank'><img src='https://lek3map.github.io/thailand/map/2003/thumbs/03032831.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>スコータイ</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=17.023121,99.675302' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=17.023121,99.675302&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a></div>");
markers[3] = L.marker([16.99792, 99.70711], {icon: icon_iseki_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Wat Chetuphon<br>วัดเชตุพน</h3><a href='https://photos.app.goo.gl/ip6H5QHQeS8L9YSx5' target='_blank'><img src='https://lek3map.github.io/thailand/map/2003/thumbs/03032838.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>スコータイ</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=16.99792,99.70711' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=16.99792,99.70711&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a></div>");
markers[4] = L.marker([17.016878, 99.7037], {icon: icon_iseki_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Wat Mahathat<br>วัดมหาธาตุ</h3><a href='https://photos.app.goo.gl/WXdrFCyWrxZmX2Gn6' target='_blank'><img src='https://lek3map.github.io/thailand/map/2003/thumbs/03032850.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>スコータイ</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=17.016878,99.7037' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=17.016878,99.7037&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a></div>");
markers[5] = L.marker([17.013825, 99.702271], {icon: icon_iseki_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Wat Sri Sawai<br>วัดศรีสวาย</h3><a href='https://photos.app.goo.gl/ZQi2A4Hmb2V12j9h6' target='_blank'><img src='https://lek3map.github.io/thailand/map/2003/thumbs/03032853.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>スコータイ</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=17.013825,99.702271' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=17.013825,99.702271&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a></div>");
markers[6] = L.marker([17.016357, 99.700016], {icon: icon_iseki_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Wat Traphang Ngoen<br>วัดตระพังเงิน</h3><a href='https://photos.app.goo.gl/oGgZENtD9y2GnYMS7' target='_blank'><img src='https://lek3map.github.io/thailand/map/2003/thumbs/03032861.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>スコータイ</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=17.016357,99.700016' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=17.016357,99.700016&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a></div>");
markers[7] = L.marker([17.019725, 99.701425], {icon: icon_iseki_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Wat Sa-Sri<br>วัดสระศรี</h3><a href='https://photos.app.goo.gl/S684WpQzf2Wyskkh8' target='_blank'><img src='https://lek3map.github.io/thailand/map/2003/thumbs/03032866.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>スコータイ</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=17.019725,99.701425' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=17.019725,99.701425&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a></div>");
markers[8] = L.marker([17.01869, 99.704193], {icon: icon_iseki_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Wat Chana Songkhram<br>วัดชนะสงคราม</h3><a href='https://photos.app.goo.gl/MB8F1t51kffXvABW6' target='_blank'><img src='https://lek3map.github.io/thailand/map/2003/thumbs/03032873.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>スコータイ</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=17.01869,99.704193' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=17.01869,99.704193&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a></div>");
markers[9] = L.marker([17.019956, 99.704679], {icon: icon_monument_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Monument of King Ramkhamhaeng the Great<br>พระบรมราชานุสาวรีย์พ่อขุนรามคำแหงมหาราช</h3><a href='https://photos.app.goo.gl/u2ryFuSPVDpD43yG6' target='_blank'><img src='https://lek3map.github.io/thailand/map/2003/thumbs/03032878.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>スコータイ</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=17.019956,99.704679' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=17.019956,99.704679&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a></div>");

if (pathPoints.length > 0) {
    var polyline = L.polyline(pathPoints, {color: '#ff0000', weight: 4, opacity: 0.8}).addTo(map);
    map.fitBounds(polyline.getBounds(), {padding: [30, 30]});
} else if (Object.keys(markers).length > 0) {
    map.fitBounds(markerGroup.getBounds(), {padding: [50, 50]});
} else {
    map.setView([13.7563, 100.5018], 6);
}

function moveToMarker(id) { 
    var m = markers[id]; 
    if(m) { map.flyTo(m.getLatLng(), 15); m.openPopup(); } 
}
</script>
</body>
</html>
